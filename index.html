.bdg-warn{background:var(--warn2);color:#7a4800}

function lookupT(gt,gta,ta){var v=ta[0];for(var i=0;i<gta.length;i++){if(gt>=gta[i])v=ta[i];else break;}return v;}
function lookupS(gt,tbl){var v=tbl[0][1];for(var i=0;i<tbl.length;i++){if(gt>=tbl[i][0])v=tbl[i][1];else break;}return v;}
function f2(v){return Math.round(v*100)/100;}

function calcAgency(gt,tons,port){
  gt=parseFloat(gt)||0;tons=parseFloat(tons)||0;
  var tbl=(port==='Carboneras'||port==='Endesa Terminal')?AGENCY_CRS:AGENCY_ALM;
  var gr=0;for(var i=0;i<AGENCY_GT.length;i++){if(gt>=AGENCY_GT[i])gr=i;else break;}
  var tc=0;for(var i=0;i<AGENCY_TONS.length;i++){if(tons>=AGENCY_TONS[i])tc=i;else break;}
  return f2(tbl[gr][tc]||946.55);
}

  gt=parseFloat(gt)||0;loa=parseFloat(loa)||0;tons=parseFloat(tons)||0;days=parseFloat(days)||1;
  var agency=calcAgency(gt,tons,port);
  var items=[];

    var pr=f2(lookupS(gt,ALM_PRAC));
    var am=f2(lookupS(gt,ALM_AMAR));
    var tug=(tugs&&(loa>100||gt>8000))?f2(lookupS(gt,ALM_TUGS)):0;
    items=[
      {n:"Practicaje (In & Out)",a:pr,c:"#1a6b8a"},
      {n:"Amarradores (In & Out)",a:am,c:"#1a6b8a"},
      {n:"Remolcadores (In & Out)",a:tug,c:"#e8a838"},
      {n:"Tasa Estancia B-1 ("+days+"d × GT "+gt+")",a:f2(gt*0.18147*days),c:"#0f3460"},
      {n:"Tasa Luces B-0",a:f2(gt*0.01995),c:"#0f3460"},
      {n:"Tasa Residuos",a:f2(gt*0.05664),c:"#0f3460"},
      {n:"Ship's clearance",a:0,c:"#2a9d60"},
      {n:"ISPS",a:0,c:"#2a9d60"},
      {n:"Honorarios agencia",a:agency,c:"#c0392b"}
    ];
  } else if(port==='Carboneras'){
    var pr=f2(lookupT(gt,CRS_PRAC_GT,CRS_PRAC_T)*2);
    var am=f2(lookupT(gt,CRS_AMAR_GT,CRS_AMAR_T));
    var tug=tugs?f2(lookupT(gt,CRS_TUGS_GT,CRS_TUGS_T)):0;
    items=[

      {n:"Varios",a:102.29,c:"#2a9d60"},

    ];
  } else if(port==='Motril'){
    var pr=f2(lookupT(gt,MOT_PRAC_GT,MOT_PRAC_T));

// MSAL
var msalConfig={auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT_ID,redirectUri:window.location.href.split('?')[0].split('#')[0]},cache:{cacheLocation:'sessionStorage'}};

function getToken(){
  return msalApp.acquireTokenSilent({scopes:SCOPES,account:msalApp.getActiveAccount()}).then(function(r){return r.accessToken;}).catch(function(){return msalApp.acquireTokenRedirect({scopes:SCOPES});});
}

function spReq(url,method,body){
  return getToken().then(function(tok){
    if(!tok)return null;
    var opts={method:method||'GET',headers:{'Authorization':'Bearer '+tok,'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata'}};
    if(body)opts.body=JSON.stringify(body);
    return fetch(url,opts).then(function(r){
      if(!r.ok)return r.text().then(function(t){throw new Error('SP Error '+r.status+': '+t);});
      if(method==='DELETE'||r.status===204)return null;
      return r.json();
    });
  });
}

function loadEscalas(){
  setSyncing(true);
  var url=SP_BASE+'/_api/web/lists/getbytitle(\''+SP_LIST+'\')/items?$select=Id,Title,vessel,port,op,cargo,tons,status,eta,gt,loa,data,Created,Author/Title&$expand=Author&$orderby=Created desc&$top=200';
  return spReq(url).then(function(r){
    escalas=(r.value||[]).map(function(item){
      var d={};try{d=JSON.parse(item.data||'{}');}catch(e){}
      return {id:item.Id.toString(),spId:item.Id,vessel:item.vessel||item.Title||'',port:item.port||'Almería',op:item.op||'UNLOADING',cargo:item.cargo||'CEMENT',tons:item.tons||0,status:item.status||'Prevista',createdAt:d.createdAt||item.Created||'',createdBy:d.createdBy||'',buque:d.buque||defE({}).buque,sof:d.sof||[],arrival:d.arrival||defE({}).arrival,sailing:d.sailing||defE({}).sailing,srs:d.srs||{checked:{},libre:''}};
    });
    setSyncing(false);
  }).catch(function(e){setSyncing(false,true);toast('Error: '+e.message);});
}

function saveEscala(e){
  setSyncing(true);
  var dj=JSON.stringify({buque:e.buque,sof:e.sof,arrival:e.arrival,sailing:e.sailing,srs:e.srs,createdBy:e.createdBy,createdAt:e.createdAt});
  var body={Title:e.vessel||'Sin nombre',vessel:e.vessel||'',port:e.port||'',op:e.op||'',cargo:e.cargo||'',tons:parseFloat(e.tons)||0,status:e.status||'Prevista',eta:e.buque.eta||null,gt:parseFloat(e.buque.gt)||0,loa:parseFloat(e.buque.loa)||0,data:dj};
  var p;
  if(!e.spId){
    var url=SP_BASE+'/_api/web/lists/getbytitle(\''+SP_LIST+'\')/items';
    p=spReq(url,'POST',body).then(function(r){e.spId=r.Id;e.id=r.Id.toString();var idx=escalas.findIndex(function(x){return x===e;});if(idx>=0)escalas[idx]=e;else escalas.unshift(e);});
  } else {
    var url=SP_BASE+'/_api/web/lists/getbytitle(\''+SP_LIST+'\')/items('+e.spId+')';
    p=getToken().then(function(tok){
      return fetch(url,{method:'PATCH',headers:{'Authorization':'Bearer '+tok,'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata','IF-MATCH':'*','X-HTTP-Method':'MERGE'},body:JSON.stringify(body)}).then(function(){var idx=escalas.findIndex(function(x){return x.spId===e.spId;});if(idx>=0)escalas[idx]=e;});
    });
  }
  return p.then(function(){setSyncing(false);toast('Guardado ✓');}).catch(function(err){setSyncing(false,true);toast('Error: '+err.message);});
}

function deleteEscala(e){
  if(!confirm('¿Eliminar esta escala?'))return;
  if(e.spId){
    getToken().then(function(tok){fetch(SP_BASE+'/_api/web/lists/getbytitle(\''+SP_LIST+'\')/items('+e.spId+')',{method:'DELETE',headers:{'Authorization':'Bearer '+tok,'IF-MATCH':'*'}});});
  }
  escalas=escalas.filter(function(x){return x.id!==e.id;});
  current=null;navTo('inicio','nav-inicio');
}

function setSyncing(on,err){
  var dot=document.getElementById('sync-dot');var txt=document.getElementById('sync-txt');
  if(!dot)return;
  dot.className='sync-dot'+(on?' syncing':err?' error':'');
  txt.textContent=on?'Guardando…':err?'Error':'';

// HELPERS
function fv(s,k){return current&&current[s]?current[s][k]||'':(current?current[k]||'':'');}
function ea(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function getDays(e){return parseFloat((e.buque.hours||'1'))||1;}

function relDate(dtStr){
  if(!dtStr)return {l1:'—',l2:'',c:'var(--tl)'};
  var d=new Date(dtStr),now=new Date(),diffH=Math.round((d-now)/3600000),diffD=Math.round((d-now)/86400000);
  var t=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),dt=d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
  if(d-now<0&&diffH>-2)return {l1:'Ahora',l2:t,c:'var(--ok)'};
  if(d-now<0)return {l1:dt,l2:t,c:'var(--tl)'};
  if(diffH<1)return {l1:'<1h',l2:t,c:'var(--err)'};
  if(diffH<6)return {l1:diffH+'h',l2:t,c:'var(--warn)'};
  if(diffH<24)return {l1:'Hoy',l2:t,c:'var(--navy)'};
  if(diffD===1)return {l1:'Mañana',l2:t,c:'var(--sea)'};
  if(diffD<7)return {l1:diffD+'d',l2:dt,c:'var(--tm)'};
  return {l1:dt,l2:t,c:'var(--tl)'};
}

function makeRow(lbl,inp){var d=document.createElement('div');d.className='row';var l=document.createElement('div');l.className='lbl';l.textContent=lbl;d.appendChild(l);d.appendChild(inp);return d;}

function makeSel(opts,val,onch){var s=document.createElement('select');s.className='sel';opts.forEach(function(o){var op=document.createElement('option');op.value=o.v||o;op.textContent=o.l||o;if((o.v||o)===val)op.selected=true;s.appendChild(op);});if(onch)s.addEventListener('change',onch);return s;}
function makeTgl(on,onch){var w=document.createElement('div');w.className='tgl-wrap';var b=document.createElement('button');b.className='tgl'+(on?' on':'');b.addEventListener('click',function(){b.classList.toggle('on');lbl.textContent=b.classList.contains('on')?'Sí':'No';if(onch)onch(b.classList.contains('on'));});var lbl=document.createElement('span');lbl.style.cssText='font-size:11px;color:var(--tm);min-width:20px';lbl.textContent=on?'Sí':'No';w.appendChild(b);w.appendChild(lbl);return w;}

// NAVIGATION
function navTo(tab,navId){
  curTab=tab;
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  var nav=document.getElementById(navId);if(nav)nav.classList.add('on');
  var titles={inicio:'Consignaciones',buque:'Buque',sof:'SOF',pda:'PDA',docs:'Documentos',srs:'Servicios',arrival:'Arrival Report',sailing:'Sailing Report',historico:'Histórico'};
  document.getElementById('hdr-title').textContent=titles[tab]||'Consignaciones';
  document.getElementById('hdr-sub').textContent=(current&&tab!=='inicio'&&tab!=='historico')?current.vessel+' · '+current.port:'S.A. López Guillén';
  renderTab();
}

function renderTab(){
  var body=document.getElementById('app-body');
  body.innerHTML='';
  if(curTab==='inicio')renderInicio();
  else if(curTab==='buque')renderBuque();
  else if(curTab==='pda')renderPda();
  else if(curTab==='sof')renderSof();
  else if(curTab==='srs')renderSrs();
  else if(curTab==='arrival')renderArrival();
  else if(curTab==='sailing')renderSailing();
  else if(curTab==='docs')renderDocs();
  else if(curTab==='historico')renderHistorico();
}

// INICIO
function renderInicio(){
  var body=document.getElementById('app-body');
  var now=new Date();
  escalas.forEach(function(e){
    var eta=e.buque.eta?new Date(e.buque.eta):null;
    var etd=e.buque.etd?new Date(e.buque.etd):null;
    if(eta&&etd&&now>=eta&&now<=etd)e.status='En Puerto';
    else if(etd&&now>etd&&e.status==='En Puerto')e.status='Completada';
    else if(eta&&now<eta&&e.status==='En Puerto')e.status='Prevista';
  });
  var prev=escalas.filter(function(e){return e.status==='Prevista';}).sort(function(a,b){return new Date(a.buque.eta||0)-new Date(b.buque.eta||0);});
  var enp=escalas.filter(function(e){return e.status==='En Puerto';});
  var comp=escalas.filter(function(e){return e.status==='Completada';}).slice(0,3);

  function makeHdr(txt,btn){var d=document.createElement('div');d.className='section-hdr';var t=document.createElement('div');t.className='section-t';t.textContent=txt;d.appendChild(t);if(btn)d.appendChild(btn);return d;}
  var newBtn=makeBtn('+ Nueva','btn bp',function(){goNew();});
  newBtn.style.cssText='flex:0 0 auto;padding:7px 12px;font-size:12px';
  body.appendChild(makeHdr('🛳 Pendientes de llegada ('+prev.length+')',newBtn));
  body.appendChild(makeGroupTable(prev,'Sin escalas previstas'));
  body.appendChild(makeHdr('⚓ En puerto ahora ('+enp.length+')'));
  body.appendChild(makeGroupTable(enp,'Ningún buque en puerto'));
  var compHdr=makeHdr('📋 Últimas completadas');
  var verTodo=document.createElement('div');verTodo.className='section-a';verTodo.textContent='Ver todo →';verTodo.addEventListener('click',function(){navTo('historico','');});
  compHdr.appendChild(verTodo);
  body.appendChild(compHdr);
  body.appendChild(makeGroupTable(comp,'Sin escalas completadas'));
}

function makeGroupTable(arr,emptyTxt){
  if(!arr.length){var d=document.createElement('div');d.className='empty';d.textContent=emptyTxt;return d;}
  var wrap=document.createElement('div');
  wrap.style.cssText='margin:0 12px 10px;background:var(--surf);border-radius:var(--r);border:0.5px solid var(--b);overflow:hidden';
  // Header row
  var hdr=document.createElement('div');
  hdr.style.cssText='display:grid;grid-template-columns:1fr 70px 55px 65px 65px;padding:6px 10px;border-bottom:0.5px solid var(--b);background:var(--surf2)';
  ['Buque / Mercancía','Puerto','Tn','ETA','ETD'].forEach(function(t){var c=document.createElement('div');c.style.cssText='font-size:10px;font-weight:600;color:var(--tm);text-transform:uppercase;text-align:'+(t==='Buque / Mercancía'?'left':'right');c.textContent=t;hdr.appendChild(c);});
  wrap.appendChild(hdr);
  arr.forEach(function(e){
    var row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:1fr 70px 55px 65px 65px;padding:9px 10px;border-bottom:0.5px solid var(--b);cursor:pointer;align-items:center';
    row.addEventListener('click',function(){openEscala(e.id);});
    row.addEventListener('mouseover',function(){row.style.background='var(--surf2)';});
    row.addEventListener('mouseout',function(){row.style.background='';});
    // Col 1: nombre + cargo
    var c1=document.createElement('div');
    var nm=document.createElement('div');nm.style.cssText='font-size:13px;font-weight:600;color:var(--t)';nm.textContent=e.vessel||'Sin nombre';
    var meta=document.createElement('div');meta.style.cssText='font-size:11px;color:var(--tm);margin-top:1px';meta.textContent=e.cargo+(e.status!=='Prevista'?' · '+e.status:'');
    c1.appendChild(nm);c1.appendChild(meta);row.appendChild(c1);
    // Col 2: puerto
    var c2=document.createElement('div');c2.style.cssText='font-size:11px;color:var(--tm);text-align:right';c2.textContent=e.port;row.appendChild(c2);
    // Col 3: tons
    var c3=document.createElement('div');c3.style.cssText='font-size:12px;font-weight:500;text-align:right';c3.textContent=e.tons||'—';row.appendChild(c3);
    // Col 4: ETA
    var er=relDate(e.buque.eta);
    var c4=document.createElement('div');c4.style.cssText='text-align:right';
    var l1=document.createElement('div');l1.style.cssText='font-size:11px;font-weight:600;color:'+er.c;l1.textContent=er.l1;
    var l2=document.createElement('div');l2.style.cssText='font-size:10px;color:var(--tl)';l2.textContent=er.l2;
    c4.appendChild(l1);c4.appendChild(l2);row.appendChild(c4);
    // Col 5: ETD
    var dr=relDate(e.buque.etd);
    var c5=document.createElement('div');c5.style.cssText='text-align:right';
    var d1=document.createElement('div');d1.style.cssText='font-size:11px;font-weight:600;color:'+dr.c;d1.textContent=dr.l1;
    var d2=document.createElement('div');d2.style.cssText='font-size:10px;color:var(--tl)';d2.textContent=dr.l2;
    c5.appendChild(d1);c5.appendChild(d2);row.appendChild(c5);
    wrap.appendChild(row);
  });
  return wrap;
}

// GENERATORS
function fdt(v){if(!v)return '__:__';var d=new Date(v);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' hrs lt';}

function showDocText(title,txt){
  var body=document.getElementById('app-body');body.innerHTML='';
  var lbl=document.createElement('div');lbl.style.cssText='padding:8px 12px 4px;font-size:11px;color:var(--tm);font-weight:600;text-transform:uppercase;letter-spacing:.6px';lbl.textContent=title;
  body.appendChild(lbl);
  var pre=document.createElement('pre');pre.className='doc';pre.id='doc-txt';pre.textContent=txt;
  body.appendChild(pre);
  var btnRow=document.createElement('div');btnRow.className='btns';
  btnRow.appendChild(makeBtn('📋 Copiar','bp',function(){if(navigator.clipboard)navigator.clipboard.writeText(pre.textContent).then(function(){toast('Copiado ✓');});else{var r=document.createRange();r.selectNode(pre);window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');window.getSelection().removeAllRanges();toast('Copiado ✓');}}));
  btnRow.appendChild(makeBtn('✉ Enviar','bs',function(){toast('Enviado ✓');}));
  body.appendChild(btnRow);
  var backBtn=makeBtn('← Volver a documentos','bg2',function(){renderDocs();});backBtn.style.cssText='margin:4px 12px 12px;width:calc(100% - 24px)';
  body.appendChild(backBtn);
}

function genDoc(type){
  var b=current.buque;
  var pn=type==='cnp-alm'?'Almería':type==='cnp-car'?'Carboneras':type==='cnp-mot'?'Motril':current.port;
  var txt='';
  if(type.indexOf('cnp')===0){
    txt='NOTIFICACIÓN — C.N.P.\nPUESTO FRONTERIZO MARÍTIMO — '+pn.toUpperCase()+'\n\nBUQUE:              '+current.vessel+'\nCAPITÁN:            '+(b.captain||'—')+'\nBANDERA:            '+(b.flag||'—')+'\nGT:                 '+(b.gt||'—')+'\nOMI:                '+(b.imo||'—')+'\nINDICATIVO:         '+(b.callsign||'—')+'\nPUERTO ANTERIOR:    '+(b.lastPort||'—')+'\nETA:                '+fdt(b.eta)+'\nATRAQUE:            '+fdt(b.etb)+'\nMUELLE:             '+(b.berth||'—')+'\nPUERTO POSTERIOR:   '+(b.nextPort||'—')+'\nETD:                '+fdt(b.etd)+'\nTRIP. LLEGADA:      '+(b.crewIn||0)+'\nTRIP. SALIDA:       '+(b.crewOut||0)+'\nPAX IN:             '+(b.paxIn||0)+'\nPAX OUT:            '+(b.paxOut||0)+'\nOPERACIÓN:          '+current.op+' '+current.cargo+' '+current.tons+' Tn\n\nRESIDUOS SÓLIDOS: 0  ORGÁNICOS: 0  OLEOSOS: 0\n\nSaludos cordiales,\nS.A. López Guillén';
  } else if(type==='eta'){
    txt='ETA NOTICE\n\nETA '+current.port+': '+fdt(b.eta)+'\nETB: '+fdt(b.etb)+'\nETD: '+fdt(b.etd)+'\nCargo: '+current.cargo+' — '+current.tons+' Tn\n\nS.A. López Guillén\nagency.almeria@salg.es';
  } else if(type==='nil'){
    txt='NIL MANIFEST\n\n'+current.vessel+' / '+(b.flag||'—')+' / '+(b.captain||'—')+'\nDE: '+(b.lastPort||'—')+' → A: '+(b.nextPort||'—')+'\n\nMercancías a bordo: NIL\nFecha: '+new Date().toLocaleDateString('es-ES');
  } else if(type==='gc'){
    txt='PUESTO FISCAL — CARBONERAS\n\nNOMBRE: '+current.vessel+' / IMO: '+(b.imo||'—')+'\nBANDERA: '+(b.flag||'—')+' / GT: '+(b.gt||'—')+' / LOA: '+(b.loa||'—')+' m\nLLEGADA: '+fdt(b.eta)+' / SALIDA: '+fdt(b.etd)+'\nPROCEDENCIA: '+(b.lastPort||'—')+' / DESTINO: '+(b.nextPort||'—')+'\nDESCARGA: '+current.cargo+' '+current.tons+' Tn';
  }
  showDocText(pn,txt);
}

function genSRS(){
  var lines=[];
  Object.entries(current.srs.checked).forEach(function(kv){if(kv[1]&&kv[0].indexOf('_nota')<0){var nota=current.srs.checked[kv[0]+'_nota'];lines.push('  • '+kv[0].split('::')[1]+(nota?' — '+nota:''));}});
  if(current.srs.libre)lines.push('\nOtros:\n'+current.srs.libre);
  showDocText('SRS','SHIP REQUIREMENT SHEET\n\nBuque: '+current.vessel+' / Puerto: '+current.port+'\nFecha: '+new Date().toLocaleDateString('es-ES')+'\n\nSERVICIOS SOLICITADOS:\n'+(lines.length?lines.join('\n'):'(ninguno seleccionado)')+'\n\nS.A. López Guillén');
}

  s.onload=function(){
    msalApp=new msal.PublicClientApplication(msalConfig);
    msalApp.initialize().then(function(){
      show('s-loading');document.getElementById('loading-msg').textContent='Verificando sesión...';
      return msalApp.handleRedirectPromise();
    }).then(function(resp){
      if(resp&&resp.account){user={name:resp.account.name,email:resp.account.username};msalApp.setActiveAccount(resp.account);afterLogin();return;}
      var accounts=msalApp.getAllAccounts();
      if(accounts.length>0){msalApp.setActiveAccount(accounts[0]);user={name:accounts[0].name,email:accounts[0].username};afterLogin();}
      else{show('s-login');}
    }).catch(function(e){show('s-login');document.getElementById('login-error').textContent='Error: '+e.message;});
  };
  s.onerror=function(){show('s-login');document.getElementById('login-error').textContent='Error cargando librería de autenticación. Comprueba la conexión.';};
  document.head.appendChild(s);
  document.getElementById('login-btn').addEventListener('click',function(){if(msalApp)msalApp.loginRedirect({scopes:SCOPES});else document.getElementById('login-error').textContent='Aún cargando, espera un momento…';});
  document.getElementById('new-btn').addEventListener('click',function(){goNew();});
  document.querySelectorAll('.ni').forEach(function(btn){btn.addEventListener('click',function(){var tab=btn.getAttribute('data-tab');navTo(tab,btn.id);});});
})();
</script>
</body>
</html>
